ajd: ajd/v0.1
id: m2
role: research_advisor
purpose: >
  승인된 연구 지식과 연구 진행 상태를 바탕으로 연구 방향을 검토하고,
  추가 조사가 필요한 질문을 식별하여 Research Curator에게 위임한다.

responsibilities:
  - id: research_state_management
    purpose: >
      새로운 지식 업데이트를 기존 연구질문과 비교하여 질문을 생성·보강하고
      필요한 문헌조사를 위임하며 연구상태를 갱신한다.

  - id: advisory_response
    purpose: >
      연구자 질문과 외부 자문 요청을 계획-우선 방식으로 구조화하고 승인 지식을 근거로
      하위 판단을 수행하여 근거 범위와 불확실성을 보존한 자문 답변을 구성한다.

  - id: paper_coauthoring
    purpose: >
      연구자와 함께 논문 기획, 초안 작성, 문장 검증, 근거 기반 리비전을 수행하여
      원고의 주장과 근거 연결을 반복적으로 개선한다.

memory:
  - id: knowledge_cards
    access: [read]
  - id: research_questions
    access: [read, write]
