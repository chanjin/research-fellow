capability: ajd-capability-contract/v0.2
id: analyze_paper
kind: action
purpose: 원문을 한 차례 읽어 source-intrinsic 논문 요약과 현재 연구 맥락의 해석, 원문 근거 기반의 후속 읽기 질문을 만든다.
uses:
  required:
  - paper
  - document
  - research_context
  optional: []
produces:
- summary
- reading_questions
- unconsumed_sections
- generation_succeeded
- generation_failed
- draft_result
data:
  paper:
    type: PaperRef
  document:
    type: DocumentText
  research_context:
    type: ResearchContext
  summary:
    type: PaperSummary
  reading_questions:
    type: ReadingQuestion
    cardinality: many
  unconsumed_sections:
    type: SectionRef
    cardinality: many
  generation_succeeded:
    type: Boolean
  generation_failed:
    type: Boolean
  draft_result:
    type: DraftResult
