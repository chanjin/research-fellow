capability: ajd-capability-contract/v0.2
id: prepare_selected_paper_review
kind: action
purpose: Review 단계에서 선택된 논문들이 연구질문 관점의 개별 리뷰를 완료했는지 확인하고 보고서 정리 단계로 넘길 준비 상태를 만든다.
uses:
  required: [selected_papers, search_profile]
  optional: []
produces: [inline_review_ready]
data:
  selected_papers: {type: PaperRef, cardinality: many}
  search_profile: {type: SearchProfile}
  inline_review_ready: {type: Boolean}
