bindings: ajd-interaction-binding/v0.1
profile: default
interactions:
  - id: select_questions_for_investigation
    renderer:
      type: multi_select
      title: "추가 근거 조사할 질문 선택"
      help: "1차 논문 읽기에서 생성된 질문 중 원문을 다시 확인해 근거를 보강할 질문을 선택합니다."
      item_label: question
      item_detail:
        - tentative_answer
        - uncertainty
      submit_label: "선택한 질문 심화 조사"
      empty_label: "선택한 질문이 없습니다."

  - id: confirm_advisory_plan
    renderer:
      type: confirm
      title: "자문 계획 확인"
      help: "M2가 제안한 판단 질문과 하위 질문을 확인한 뒤 이 계획으로 근거 수집과 자문 작성을 진행합니다."
      confirm_label: "이 계획으로 진행"
      cancel_label: "계획까지만 저장"

  - id: resolve_pending_decision_requests
    renderer:
      type: approval
      title: "연구자 검토·승인함"
      help: "M1·M2가 제안한 안건을 선택하고 승인, 보완 요청, 반려 중 하나를 결정합니다."
      item_id: phenomenon_id
      item_label: payload.title
      select_all_label: "검토할 대기 안건"
      approve_label: "선택 안건 승인"
      defer_label: "선택 안건 보완 요청"
      reject_label: "선택 안건 반려"
      comment_label: "공통 의견 (선택)"
      empty_label: "결정할 안건을 하나 이상 선택하세요."
  - id: resolve_ontology_change_reviews
    renderer:
      type: approval
      title: "Ontology 변경안 최종 결정"
      help: "검토 중인 Ontology 변경안을 새 버전으로 발행하거나, 계속 검토하거나, 반려합니다."
      item_id: review_id
      item_label: proposal.summary
      output_id_field: review_id
      default_all: true
      select_all_label: "결정할 Ontology 변경안"
      approve_label: "선택 변경안 승인·발행"
      defer_label: "계속 검토"
      reject_label: "선택 변경안 반려"
      comment_label: "연구자 의견 (선택)"
      empty_label: "결정할 Ontology 변경안을 선택하세요."

  - id: resolve_revision_applications
    renderer:
      type: approval
      title: "Revision 해결안 원고 반영 결정"
      help: "제안된 원고 변경을 실제 원고 버전과 Revision To-do 상태에 반영할지 결정합니다."
      item_id: candidate_id
      item_label: title
      output_id_field: candidate_id
      default_all: true
      select_all_label: "결정할 Revision 해결안"
      approve_label: "원고 반영·To-do 완료"
      defer_label: "보류"
      reject_label: "해결안 반려"
      comment_label: "연구자 의견 (선택)"
      empty_label: "결정할 Revision 해결안을 선택하세요."


  - id: review_ontology_change
    renderer:
      type: review_form
      title: "Ontology 변경안 수정·보완 검토"
      help: "변경안에 대한 구조화 의견과 자유 의견을 작성하고 저장하거나 수정 Diff 재생성을 요청합니다."
      variant: ontology_change
      submit_label: "검토 의견 저장"
      regenerate_label: "의견 반영 Diff 재생성"

  - id: review_revision_todo_reconciliation
    renderer:
      type: review_form
      title: "Revision To-do 재평가 검토"
      help: "Agent가 제안한 To-do 상태와 다음 작업 내용을 수정하고, 다음 Revision 백로그에 반영할 항목을 선택합니다."
      variant: revision_reconciliation
      submit_label: "검토 결과 반영 · 다음 Revision 백로그 구성"
