interaction: ajd-interaction/v0.1
id: confirm_advisory_plan
actor: researcher
purpose: >
  M2가 생성한 자문 계획을 연구자가 검토하고, 해당 계획에 따라 근거 수집과
  하위 질문별 판단을 계속 진행할지 확인한다.
mode: confirm
uses:
  required:
    - plan
  optional: []
produces:
  - advisory_plan_confirmed
data:
  plan:
    type: AdvisoryPlan
  advisory_plan_confirmed:
    type: Boolean
completion:
  requires_response: true
