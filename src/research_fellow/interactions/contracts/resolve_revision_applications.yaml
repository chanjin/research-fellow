interaction: ajd-interaction/v0.1
id: resolve_revision_applications
actor: researcher
purpose: >
  M2가 제안한 Revision To-do 해결 결과와 원고 변경 Diff를 검토하고,
  실제 원고 버전과 To-do 상태에 반영할지 연구자가 최종 결정한다.
mode: decide
uses:
  required:
    - revision_application_candidates
  optional: []
produces:
  - revision_application_resolutions
data:
  revision_application_candidates:
    type: RevisionApplicationCandidate
    cardinality: many
  revision_application_resolutions:
    type: RevisionApplicationResolution
    cardinality: many
constraints:
  min_selection: 1
  decisions:
    - approved
    - deferred
    - rejected
authority:
  holder: researcher
boundary:
  phenomenon: revision_resolution_proposal
  recipient: researcher
  status: proposed
completion:
  requires_response: true
