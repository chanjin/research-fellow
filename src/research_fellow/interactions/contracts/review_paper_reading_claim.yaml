interaction: ajd-interaction/v0.1
id: review_paper_reading_claim
actor: researcher
purpose: >
  논문 읽기에서 생성된 잠정 해석과 원문 근거를 연구자가 검토하여 지식카드 등록,
  기존 카드 근거 보강, 보류 또는 무관 처리를 결정한다.
mode: review
uses:
  required:
    - paper
    - reading_question
    - research_context
  optional:
    - duplicate_candidates
produces:
  - evidence_review

data:
  paper:
    type: PaperRef
  reading_question:
    type: ReadingQuestion
  research_context:
    type: ResearchContext
  duplicate_candidates:
    type: KnowledgeCard
    cardinality: many
  evidence_review:
    type: EvidenceReview
boundary:
  phenomenon: paper_reading_knowledge_review
  recipient: researcher
  status: proposed
completion:
  requires_response: true
