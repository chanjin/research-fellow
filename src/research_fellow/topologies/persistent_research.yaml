topology: ajd-topology/v0.1
id: research_fellow_persistent_research
revision: 1
purpose: M2 Research Advisor와 M1 Research Curator의 지속 연구 topology를 표현한다. M2→M1 문헌조사
  위임은 자동 handoff지만, 논문의 서재함 편입과 지식 승격은 연구자 Interaction boundary를 거친다. 따라서 현재 topology는
  사람을 우회하는 machine-only closed loop를 주장하지 않는다.
roots:
- m2_research_cycle
- m1_knowledge_acquisition
- m2_research_question_answer
loops: []
boundary_interactions:
- phenomenon: advice_report
  direction: outbound
  workflow: m2_research_cycle
  actor: researcher
- phenomenon: advice_report
  direction: outbound
  workflow: m1_auto_literature_review
  actor: researcher
- phenomenon: research_answer_draft_request
  direction: inbound
  workflow: m2_research_question_answer
  actor: researcher
- phenomenon: researcher_knowledge_acquisition_request
  direction: inbound
  workflow: m1_knowledge_acquisition
  actor: researcher
- phenomenon: decision_request
  direction: outbound
  workflow: m1_knowledge_curation
  actor: researcher
invariants:
- m2_to_m1_literature_delegation_is_traceable
- paper_preservation_remains_researcher_controlled
- knowledge_updates_only_follow_explicit_knowledge_approval
- knowledge_acquisition_remains_researcher_initiated_and_approval_gated
- research_answer_drafting_requires_explicit_researcher_confirmation
- research_answer_uses_only_approved_knowledge_and_preserved_evidence
- topology_does_not_create_new_python_orchestration
