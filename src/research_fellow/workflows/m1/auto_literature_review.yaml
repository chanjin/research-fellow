dsl: ajd-workflow/v0.2
id: m1_auto_literature_review
revision: 1
agent: m1
realizes:
- literature_curation
purpose: 'M2가 발행한 Curation Intent를 받아 외부 LLM을 통해 실제 관련 논문 후보를 직접 발견하고, 후보 문헌의 원문을
  검토하여 연구자와 M2가 사용할 수 있는 문헌조사 결과를 만든다.

  '
trigger:
  phenomenon: curation_intent
  from: m2
  condition: ready
inputs:
- curation_intent
outcomes:
  search_result:
    one_of:
    - search_succeeded
    - search_failed
memory:
  reads:
  - search_profiles
  - literature_history
  writes:
  - search_profiles
  - literature_reviews
steps:
- id: plan_literature_search
  kind: action
  uses:
    required:
    - curation_intent
  produces:
  - search_profile
  - search_strategy
  - discovered_candidates
  - auto_run_id
  - intent_id
  purpose: 'Curation Intent의 전체 맥락을 외부 LLM에 전달해 실제 관련 논문 후보를 직접 발견한다.

    '
- id: discover_and_screen_literature
  kind: action
  uses:
    required:
    - search_profile
    - search_strategy
  produces:
  - search_outcome
  - search_succeeded
  - search_failed
  purpose: '외부 LLM이 발견한 논문 후보를 정규화하고 관련도 기준으로 본문 검토 대상을 선별한다.

    '
- id: record_search_failure
  kind: action
  when: search_failed
  uses:
    required:
    - search_outcome
  produces:
  - status
  - report
  - run
  - papers
  emits:
  - phenomenon: advice_report
    to:
    - researcher
    - m2
- id: review_literature_candidates
  kind: interaction
  interaction: review_literature_candidates
  actor: researcher
  when: search_succeeded
  uses:
    required:
    - discovered_candidates
  produces:
  - selected_papers
  purpose: '외부 LLM이 찾은 논문 후보 중 연구자가 서재함에 보존하고 심화 검토할 논문을 선택한다. 문헌 후보는 이 선택 전까지 연구자
    지식자산이나 승인 지식으로 승격되지 않는다.

    '
- id: preserve_selected_literature_candidates
  kind: action
  when: search_succeeded
  uses:
    required:
    - selected_papers
    - search_outcome
    - search_profile
  produces:
  - preserved_papers
  - search_outcome
  - paper_selection_completed
  purpose: '연구자가 명시적으로 선택한 논문만 기존 Paper Shelf에 보존하고 이후 심화 검토 대상을 그 논문으로 제한한다.

    '
- id: prepare_selected_paper_review
  kind: action
  when: search_succeeded
  uses:
    required:
    - selected_papers
    - search_profile
  produces:
  - inline_review_ready
  purpose: 'Review 단계에서 선택된 각 논문의 연구질문 관점 요약이 완료되었는지 확인한다.'

- id: apply_selected_paper_review
  kind: action
  when: search_succeeded
  uses:
    required:
    - selected_papers
    - search_outcome
  produces:
  - reviewed_papers
  - report_run
  - paper_analysis_ids
  - knowledge_request_ids
  purpose: 'Review 단계에서 논문별로 완료된 원문 해석·요약·지식카드 후보를 문헌조사 결과로 정규화한다. 추가 외부 LLM 입력 단계는 만들지 않는다.'

- id: stage_literature_knowledge_candidates
  kind: action
  when: search_succeeded
  uses:
    required:
    - reviewed_papers
    - preserved_papers
    - search_profile
  produces:
  - paper_analysis_ids
  - knowledge_request_ids
  purpose: 'Review 단계에서 이미 저장된 Paper Summary와 Knowledge Card 승인 요청을 집계한다. 새 지식후보를 중복 생성하지 않는다.'

- id: synthesize_literature_report_deterministic
  kind: action
  when: search_succeeded
  uses:
    required:
    - search_profile
    - report_run
    - reviewed_papers
  produces:
  - synthesis
  purpose: '선택 논문의 외부 LLM 1차 리뷰 결과를 바탕으로 추가 LLM 호출 없이 1차 문헌조사 보고서를 구성한다.'
- id: finalize_literature_review
  kind: action
  when: search_succeeded
  uses:
    required:
    - synthesis
    - reviewed_papers
    - report_run
    - search_strategy
  produces:
  - status
  - report
  - run
  - papers
  - report_id
  - retry_run_id
  emits:
  - phenomenon: advice_report
    to:
    - researcher
    - m2
  purpose: '문헌조사 결과를 보고서로 보존하고 Curation Intent를 완료한다. 부분 실패가 남아 있으면 완료 대신 추가 확인이 필요한
    결과로 남긴다.

    '
outputs:
  required:
  - status
  - report
  - run
  - papers
  - search_strategy
  optional:
  - selected_papers
  - paper_analysis_ids
  - knowledge_request_ids
  - preserved_papers
  - report_id
  - retry_run_id
completion:
  criteria:
  - curation_intent_is_resolved_or_reported_as_failed
  - researcher_facing_result_is_recorded
invariants:
- every_review_is_traceable_to_curation_intent
- published_report_records_search_run
- literature_report_is_not_a_knowledge_update
- knowledge_cards_require_separate_researcher_approval
- completed_intent_has_researcher_facing_report
- paper_shelf_changes_require_explicit_researcher_selection
