dsl: ajd-workflow/v0.2
id: m1_auto_literature_review
revision: 1
agent: m1
realizes: [literature_curation]
purpose: >
  M2가 발행한 Curation Intent를 받아 문헌탐색 전략을 수립하고,
  후보 문헌의 초록과 원문을 검토하여 연구자와 M2가 사용할 수 있는 문헌조사 결과를 만든다.

trigger:
  phenomenon: curation_intent
  from: m2
  condition: ready

inputs:
  - curation_intent

outcomes:
  search_result:
    one_of: [search_succeeded, search_failed]

memory:
  reads:
    - search_profiles
    - literature_history
  writes:
    - search_profiles
    - literature_reviews

steps:
  - id: plan_literature_search
    kind: action
    uses:
      required: [curation_intent]
    produces: [search_profile, search_strategy]
    purpose: >
      Curation Intent의 목적에 맞는 문헌탐색 범위와 검색전략을 정한다.

  - id: discover_and_screen_literature
    kind: action
    uses:
      required: [search_profile, search_strategy]
    produces: [search_outcome, search_succeeded, search_failed]
    purpose: >
      문헌을 탐색하고 초록 수준에서 조사 목적과의 관련성을 검토한다.

  - id: record_search_failure
    kind: action
    when: search_failed
    uses:
      required: [search_outcome]
    produces: [status, report, run, papers]
    emits:
      - phenomenon: advice_report
        to: [researcher, m2]

  - id: review_full_texts
    kind: action
    when: search_succeeded
    uses:
      required: [search_outcome, search_profile]
    produces: [reviewed_papers, report_run]

  - id: synthesize_literature_report
    kind: action
    when: search_succeeded
    uses:
      required: [search_profile, report_run, reviewed_papers]
    produces: [synthesis]

  - id: finalize_literature_review
    kind: action
    when: search_succeeded
    uses:
      required: [synthesis, reviewed_papers, report_run, search_strategy]
    produces: [status, report, run, papers, report_id, retry_run_id]
    emits:
      - phenomenon: advice_report
        to: [researcher, m2]
      - phenomenon: knowledge_update
        to: [m2]
    purpose: >
      문헌조사 결과를 보고서로 보존하고 Curation Intent를 완료한다.
      부분 실패가 남아 있으면 완료 대신 추가 확인이 필요한 결과로 남긴다.

outputs:
  required:
    - status
    - report
    - run
    - papers
    - search_strategy
  optional:
    - report_id
    - retry_run_id

completion:
  criteria:
    - curation_intent_is_resolved_or_reported_as_failed
    - researcher_facing_result_is_recorded

invariants:
  - every_review_is_traceable_to_curation_intent
  - published_report_records_search_run
  - completed_intent_has_researcher_facing_report
