dsl: ajd-workflow/v0.2
id: m1_evidence_investigation
revision: 1
agent: m1
realizes: [evidence_investigation]
purpose: >
  연구자가 선택한 논문 읽기 질문에 대해 원문을 다시 검토하여
  1차 잠정 답변을 검증·수정하고 추가 근거와 남은 불확실성을 보존한다.

trigger:
  phenomenon: researcher_evidence_investigation_request
  from: researcher

inputs:
  - paper
  - document
  - selected_questions

outcomes:
  generation_result:
    one_of: [generation_succeeded, generation_failed]

memory:
  reads:
    - paper_shelf
    - reading_questions
  writes:
    - reading_reviews

steps:
  - id: investigate_evidence
    kind: action
    uses:
      required: [paper, document, selected_questions]
    produces: [reviews, raw_output, generation_succeeded, generation_failed, validation_error, draft_result]
    purpose: >
      선택된 질문마다 논문 원문을 다시 읽어 잠정 답변을 검증·수정하고
      추가 근거와 여전히 남는 불확실성을 확인한다.

  - id: commit_evidence_reviews
    kind: action
    when: generation_succeeded
    uses:
      required: [paper, reviews]
    produces: [saved_review_count, reading_reviews]
    purpose: >
      질문별 재검토 결과를 1차 읽기 질문과 분리된 evidence review 자산으로 보존한다.

outputs:
  required:
    - reviews
    - generation_succeeded
    - generation_failed
    - validation_error
    - draft_result
  optional:
    - saved_review_count
    - reading_reviews

completion:
  criteria:
    - every_selected_question_is_reviewed_or_generation_failure_is_reported

invariants:
  - first_pass_question_is_not_overwritten
  - every_review_refers_to_a_selected_question
  - additional_evidence_remains_page_grounded
  - remaining_uncertainty_is_preserved
