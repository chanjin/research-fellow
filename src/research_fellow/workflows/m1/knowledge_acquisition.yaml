dsl: ajd-workflow/v0.2
id: m1_knowledge_acquisition
revision: 1
agent: m1
realizes: [knowledge_acquisition]
purpose: >
  선택된 논문을 읽고, 연구자가 추가 확인할 질문을 선택하도록 한 뒤,
  필요한 근거를 재검토하고 지식 후보를 큐레이션하여 연구자 승인 대상으로 연결한다.
  하위 workflow의 내부 구현을 반복하지 않고 M1의 지식 획득 직무 구조만 명세한다.

trigger:
  phenomenon: researcher_knowledge_acquisition_request
  from: researcher

inputs:
  - paper
  - document
  - research_context
  - approved_cards

memory:
  reads:
    - paper_shelf
    - paper_analysis
    - reading_questions
    - reading_reviews
    - knowledge_cards
  writes:
    - paper_analysis
    - reading_questions
    - reading_reviews

steps:
  - id: read_paper
    kind: workflow
    workflow: m1_paper_reading_summary
    uses:
      required: [paper, document, research_context]
    produces:
      - summary
      - reading_questions
      - generation_succeeded
      - generation_failed
      - draft_result
    purpose: >
      논문 자체의 문제·접근·결과를 요약하고 현재 연구 맥락에서 추가로 확인할 질문을 만든다.

  - id: select_questions_for_investigation
    kind: interaction
    interaction: select_questions_for_investigation
    actor: researcher
    when: generation_succeeded
    uses:
      required: [reading_questions]
    produces: [selected_questions]
    purpose: >
      연구자가 추가 원문 검토가 필요한 질문을 선택하거나 질문 구성을 조정한다.

  - id: investigate_selected_evidence
    kind: workflow
    workflow: m1_evidence_investigation
    when: selected_questions
    uses:
      required: [paper, document, selected_questions]
    produces:
      - reviews
      - reading_reviews
    purpose: >
      선택된 질문에 대해 원문을 다시 검토하여 잠정 답변을 보강하고 추가 근거와 불확실성을 보존한다.

  - id: curate_selected_knowledge
    kind: workflow
    workflow: m1_knowledge_curation
    when: selected_questions
    uses:
      required: [paper, selected_questions, approved_cards]
      optional: [reading_reviews]
    produces:
      - candidates
      - assessments
      - request_ids
    purpose: >
      선택된 질문과 확보된 근거를 승인 지식과 비교하여 신규·보강·충돌·보류 후보로 정리하고 승인 요청으로 연결한다.

outputs:
  required:
    - summary
    - reading_questions
    - generation_succeeded
    - generation_failed
  optional:
    - selected_questions
    - reading_reviews
    - candidates
    - assessments
    - request_ids

completion:
  criteria:
    - first_pass_reading_is_recorded_or_failure_is_reported
    - selected_questions_are_investigated_when_researcher_requests_deeper_review
    - curated_knowledge_changes_remain_gated_by_researcher_approval

invariants:
  - paper_summary_remains_source_intrinsic
  - researcher_controls_which_questions_receive_deeper_investigation
  - evidence_investigation_does_not_overwrite_first_pass_reading
  - semantic_memory_changes_only_after_researcher_approval
