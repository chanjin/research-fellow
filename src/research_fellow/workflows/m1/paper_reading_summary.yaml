dsl: ajd-workflow/v0.2
id: m1_paper_reading_summary
revision: 1
agent: m1
realizes: [paper_reading]
purpose: >
  서재함의 논문 원문을 읽어 원 논문의 문제·접근·결과를 독립적인 요약으로 정리하고,
  현재 연구 맥락에서 추가로 확인할 원문 근거 기반 질문을 만든다.

trigger:
  phenomenon: researcher_reading_request
  from: researcher

inputs:
  - paper
  - document
  - research_context

outcomes:
  generation_result:
    one_of: [generation_succeeded, generation_failed]

memory:
  reads:
    - paper_shelf
    - paper_analysis
  writes:
    - paper_analysis
    - reading_questions

steps:
  - id: analyze_paper
    kind: action
    uses:
      required: [paper, document, research_context]
    produces: [summary, reading_questions, unconsumed_sections, generation_succeeded, generation_failed, draft_result]
    purpose: >
      원문을 한 차례 읽어 source-intrinsic 논문 요약과 현재 연구 맥락의 해석,
      원문 근거 기반의 후속 읽기 질문을 만든다.

  - id: commit_reading_assets
    kind: action
    when: generation_succeeded
    uses:
      required: [summary, reading_questions]
    produces: [paper_analysis, saved_question_ids, reading_status]
    purpose: >
      읽기 결과를 paper asset과 후속 질문으로 보존하고 논문의 읽기 상태를 갱신한다.

outputs:
  required:
    - summary
    - reading_questions
    - unconsumed_sections
    - generation_succeeded
    - generation_failed
    - draft_result
  optional:
    - saved_question_ids

completion:
  criteria:
    - first_pass_reading_result_is_recorded_or_generation_failure_is_reported

invariants:
  - summary_is_source_intrinsic
  - reading_questions_keep_page_grounding
  - raw_llm_output_is_preserved
  - research_context_is_not_copied_into_card_context
